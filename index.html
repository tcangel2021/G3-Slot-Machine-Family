<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Who is he/she?</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --top-panel-bg: rgba(255, 255, 255, 0.95);
            --slot-bg: #FFFFFF; 
            --btn-spin-bg: #00E676;
            --btn-reveal-bg: #FF3D00;
            --btn-reset-bg: #2979FF;
            --btn-prize-bg: #FFD700;
            --font-family: 'Fredoka', sans-serif;
            --neon-pink: #FF007F;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); user-select: none; touch-action: manipulation; }

        body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; background-color: #000; }

        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 900px; z-index: 10; padding: 20px; }
        .active { display: flex; }

        #startScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .bubble-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none; border-radius: 100px; color: white; font-size: 3rem; padding: 40px 100px; cursor: pointer;
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.4);
            animation: pulseBubble 2.5s infinite;
        }
        @keyframes pulseBubble { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .bg-container { position: fixed; inset: 0; background: url('https://cdn.vectorstock.com/i/500p/71/33/neon-slot-machine-frame-777-jackpot-vector-61827133.jpg') no-repeat center center; background-size: cover; filter: blur(4px) brightness(0.35); z-index: -1; }

        header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 15px; position: relative; }
        h1 { color: #FFFFFF; font-size: 2.8rem; text-shadow: 0 0 10px var(--neon-pink); }

        .score-board { background: var(--neon-pink); color: white; padding: 10px 25px; border-radius: 30px; font-size: 1.5rem; box-shadow: 0 5px 0 #C50063; visibility: visible; }

        .settings-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 8px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; }
        .settings-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 20px; z-index: 7000; width: 300px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .settings-modal h2 { margin-bottom: 20px; color: #333; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 1.2rem; }
        .toggle-switch { width: 50px; height: 25px; background: #ccc; border-radius: 25px; position: relative; cursor: pointer; }
        .toggle-switch.on { background: var(--btn-spin-bg); }
        .toggle-switch::after { content: ''; position: absolute; width: 21px; height: 21px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.2s; }
        .toggle-switch.on::after { left: 27px; }

        .top-panel { background: var(--top-panel-bg); width: 100%; padding: 20px; border-radius: 25px; text-align: center; font-size: 2.2rem; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px; border: 6px solid var(--neon-pink); }
        .pattern-guide { color: #888; font-size: 1.6rem; margin-bottom: 5px; }
        .answer-text { color: #333; font-weight: 600; min-height: 1.2em; }

        .slot-machine { display: flex; gap: 20px; margin-bottom: 30px; }
        .slot { background: var(--slot-bg); width: 260px; height: 220px; border-radius: 30px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 15px 25px rgba(0,0,0,0.6); }
        .slot::after { content: ""; position: absolute; inset: 10px; background: white; border-radius: 22px; z-index: 2; }
        .slot-content { position: relative; z-index: 3; text-align: center; }
        .slot-emoji { font-size: 5.5rem; }
        .slot-text { font-size: 2rem; font-weight: 600; color: #444; }

        .controls { display: flex; gap: 15px; justify-content: center; }
        .controls button { border: none; border-radius: 50px; padding: 12px 30px; font-size: 1.4rem; font-weight: 600; color: white; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.4); }
        button:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.4); }
        button:disabled { opacity: 0.3; filter: grayscale(1); }

        .claw-area { width: 600px; height: 450px; background: rgba(255, 255, 255, 0.05); border: 8px solid #FFD700; border-radius: 20px; position: relative; overflow: hidden; margin-bottom: 20px; }
        .claw-assembly { position: absolute; top: 0; left: 50%; width: 80px; height: 100%; z-index: 100; pointer-events: none; margin-left: -40px; }
        .claw-rope { width: 6px; height: 60px; background: #888; margin: 0 auto; transition: height 0.8s ease-in-out; position: relative; }
        .claw-hand { width: 80px; height: 45px; background: #666; position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); border-radius: 8px 8px 25px 25px; display: flex; justify-content: space-around; }
        .claw-hand::after, .claw-hand::before { content: ""; width: 10px; height: 35px; background: #444; border-radius: 4px; }
        .prize-pit { position: absolute; bottom: 15px; width: 100%; height: 100px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .prize-ball { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; box-shadow: inset -5px -5px 10px rgba(0,0,0,0.4); position: relative; }
        .ball-grabbed { position: absolute !important; bottom: -55px; left: 50%; transform: translateX(-50%); }
        .jackpot-tag { position: absolute; top: -30px; font-weight: bold; color: #FFD700; font-size: 1.2rem; text-shadow: 0 0 5px black; animation: flash 0.5s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .btn-spin { background: var(--btn-spin-bg); }
        .btn-reveal { background: var(--btn-reveal-bg); }
        .btn-reset { background: var(--btn-reset-bg); }
        .btn-prize { background: var(--btn-prize-bg); color: #333 !important; }

        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
        #fsBtn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 5px 10px; border-radius: 5px; z-index: 6000; cursor: pointer; }
    </style>
</head>
<body>

    <button id="fsBtn">Full Screen</button>

    <div id="startScreen">
        <h1 style="margin-bottom: 40px; font-size: 4rem;">Are you Ready?</h1>
        <button class="bubble-btn" onclick="startGame()">START</button>
    </div>

    <div class="settings-modal" id="settingsModal">
        <h2>Settings</h2>
        <div class="setting-item">
            <span>Show Score</span>
            <div class="toggle-switch on" id="toggleScore" onclick="toggleOption('score')"></div>
        </div>
        <div class="setting-item">
            <span>1 Point Mode</span>
            <div class="toggle-switch on" id="togglePoints" onclick="toggleOption('points')"></div>
        </div>
        <button class="btn-reset" onclick="closeSettings()" style="width: 100%; padding: 10px; margin-top: 10px;">Close</button>
    </div>

    <div class="bg-container"></div>
    <canvas id="confetti"></canvas>

    <div class="screen" id="slotScreen">
        <header>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
            <h1>Who is he/she?</h1>
            <div class="score-board" id="scoreBoard">Points: <span id="score">0</span></div>
        </header>
        <div class="top-panel">
            <div class="pattern-guide">He/She is my/a... | He/She is...</div>
            <div class="answer-text" id="answerDisplay"></div>
        </div>
        <div class="slot-machine">
            <div class="slot"><div class="slot-content" id="familyContent"><div class="slot-emoji">❓</div><div class="slot-text">family</div></div></div>
            <div class="slot"><div class="slot-content" id="descContent"><div class="slot-emoji">❓</div><div class="slot-text">description</div></div></div>
        </div>
        <div class="controls">
            <button class="btn-spin" id="spinBtn" onclick="spinSlots()">🎰 Spin</button>
            <button class="btn-reveal" id="revealBtn" onclick="revealAnswer()" disabled>👁️ Reveal</button>
            <button class="btn-prize" id="prizeBtn" onclick="goToClawMachine()">🎁 Prize</button>
            <button class="btn-reset" id="resetBtn" onclick="resetGame()">🔁 Next</button>
        </div>
    </div>

    <div class="screen" id="prizeScreen">
        <header><h1 style="color: #FFD700;">🎁 Prize Claw</h1></header>
        <div class="claw-area" id="clawArea">
            <div class="claw-assembly" id="clawAssembly">
                <div class="claw-rope" id="clawRope"><div class="claw-hand" id="clawHand"></div></div>
            </div>
            <div class="prize-pit" id="prizePit"></div>
        </div>
        <div class="controls">
            <button class="btn-prize" id="catchBtn" onclick="catchBall()">🏗️ Catch</button>
            <button class="btn-reset" id="backBtn" onclick="backToSlots()" style="display:none;">🔙 Back</button>
        </div>
    </div>

    <script>
        const familyData = [
            { label: 'father', emoji: '👨', pronoun: 'He' }, { label: 'mother', emoji: '👩', pronoun: 'She' },
            { label: 'grandfather', emoji: '👴', pronoun: 'He' }, { label: 'grandmother', emoji: '👵', pronoun: 'She' },
            { label: 'brother', emoji: '👦', pronoun: 'He' }, { label: 'sister', emoji: '👧', pronoun: 'She' },
            { label: 'baby boy', emoji: '👶', pronoun: 'He', isBaby: true }, { label: 'baby girl', emoji: '🧒', pronoun: 'She', isBaby: true }
        ];
        const descData = [{ label: 'tall', emoji: '⬆️' }, { label: 'short', emoji: '⬇️' }];

        let totalScore = 0, audioCtx, isSpinning = false, lastClawX = 50;
        let settings = { showScore: true, onePointMode: true };

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, type, duration, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function startGame() { initAudio(); document.getElementById('startScreen').style.display = 'none'; document.getElementById('slotScreen').classList.add('active'); }

        function openSettings() { document.getElementById('settingsModal').style.display = 'block'; playSound(600, 'sine', 0.1, 0.05); }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; playSound(400, 'sine', 0.1, 0.05); }
        function toggleOption(type) {
            initAudio();
            if (type === 'score') {
                settings.showScore = !settings.showScore;
                document.getElementById('toggleScore').classList.toggle('on');
                document.getElementById('scoreBoard').style.visibility = settings.showScore ? 'visible' : 'hidden';
            } else {
                settings.onePointMode = !settings.onePointMode;
                document.getElementById('togglePoints').classList.toggle('on');
            }
            playSound(800, 'sine', 0.05, 0.05);
        }

        function spinSlots() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('answerDisplay').innerText = "Spinning...";
            let ticks = 0;
            const spinInterval = setInterval(() => {
                const f = familyData[Math.floor(Math.random() * familyData.length)];
                const d = descData[Math.floor(Math.random() * descData.length)];
                document.getElementById('familyContent').innerHTML = `<div class="slot-emoji">${f.emoji}</div><div class="slot-text">${f.label}</div>`;
                document.getElementById('descContent').innerHTML = `<div class="slot-emoji">${d.emoji}</div><div class="slot-text">${d.label}</div>`;
                playSound(200 + (Math.random() * 100), 'square', 0.05, 0.03);
                if (++ticks > 20) {
                    clearInterval(spinInterval);
                    isSpinning = false;
                    document.getElementById('revealBtn').disabled = false;
                    document.getElementById('answerDisplay').innerText = "";
                }
            }, 100);
        }

        function revealAnswer() {
            if (document.getElementById('revealBtn').disabled) return;
            playSound(550, 'sine', 0.2, 0.1);
            const fLabel = document.querySelector('#familyContent .slot-text').innerText;
            const fObj = familyData.find(f => f.label === fLabel);
            const dLabel = document.querySelector('#descContent .slot-text').innerText;
            const text = fObj.isBaby ? `${fObj.pronoun} is a baby. ${fObj.pronoun} is short.` : `${fObj.pronoun} is my ${fLabel}. ${fObj.pronoun} is ${dLabel}.`;
            document.getElementById('answerDisplay').innerText = text;
            const utter = new SpeechSynthesisUtterance(text); utter.rate = 0.8; window.speechSynthesis.speak(utter);
            const pts = settings.onePointMode ? 1 : 2;
            totalScore += pts;
            document.getElementById('score').innerText = totalScore;
            document.getElementById('revealBtn').disabled = true;
        }

        function resetGame() {
            document.getElementById('answerDisplay').innerText = "";
            document.getElementById('familyContent').innerHTML = `<div class="slot-emoji">❓</div><div class="slot-text">family</div>`;
            document.getElementById('descContent').innerHTML = `<div class="slot-emoji">❓</div><div class="slot-text">description</div>`;
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('revealBtn').disabled = true;
        }

        const assembly = document.getElementById('clawAssembly');
        const area = document.getElementById('clawArea');

        function moveClaw(e) {
            if (document.getElementById('catchBtn').disabled) return;
            const rect = area.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let xPercent = ((clientX - rect.left) / rect.width) * 100;
            xPercent = Math.max(10, Math.min(90, xPercent));
            lastClawX = xPercent;
            assembly.style.left = `${xPercent}%`;
        }

        area.addEventListener('mousemove', moveClaw);
        area.addEventListener('touchmove', (e) => { e.preventDefault(); moveClaw(e); }, {passive: false});

        function goToClawMachine() {
            document.getElementById('slotScreen').classList.remove('active');
            document.getElementById('prizeScreen').classList.add('active');
            setupClaw();
        }

        function setupClaw() {
            document.getElementById('clawHand').innerHTML = '';
            document.getElementById('clawRope').style.height = '60px';
            document.getElementById('catchBtn').disabled = false;
            document.getElementById('backBtn').style.display = 'none';
            assembly.style.left = `${lastClawX}%`;
            const pit = document.getElementById('prizePit');
            pit.innerHTML = '';
            const colors = ['#FF007F', '#00E676', '#2979FF', '#FFD700', '#9D4EDD'];
            for (let i = 0; i < 12; i++) {
                const ball = document.createElement('div');
                ball.className = 'prize-ball';
                ball.style.background = colors[i % colors.length];
                ball.innerHTML = "⭐";
                ball.dataset.val = (i === 0) ? 4 : Math.floor(Math.random() * 2) + 1;
                pit.appendChild(ball);
            }
        }

        function catchBall() {
            document.getElementById('catchBtn').disabled = true;
            const rope = document.getElementById('clawRope');
            let whirrInterval = setInterval(() => playSound(100, 'triangle', 0.05, 0.02), 100);
            rope.style.height = '310px';
            setTimeout(() => {
                clearInterval(whirrInterval);
                const balls = document.querySelectorAll('.prize-ball');
                const winner = balls[Math.floor(Math.random() * balls.length)];
                winner.classList.add('ball-grabbed');
                document.getElementById('clawHand').appendChild(winner);
                rope.style.height = '60px';
                setTimeout(() => {
                    const pts = parseInt(winner.dataset.val);
                    totalScore += pts;
                    document.getElementById('score').innerText = totalScore;
                    if(pts === 4) { 
                        winner.innerHTML = `<div class="jackpot-tag">JACKPOT!</div>+${pts}`;
                        playSound(523, 'sine', 0.1, 0.1); 
                        setTimeout(() => playSound(659, 'sine', 0.1, 0.1), 100);
                        setTimeout(() => playSound(783, 'sine', 0.4, 0.1), 200);
                        triggerConfetti(true); 
                    } else { 
                        winner.innerHTML = `+${pts}`;
                        playSound(400, 'sine', 0.1, 0.1);
                        setTimeout(() => playSound(600, 'sine', 0.3, 0.1), 100);
                        triggerConfetti(false);
                    }
                    document.getElementById('backBtn').style.display = 'block';
                }, 1000);
            }, 800);
        }

        function triggerConfetti(isJackpot) {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const count = isJackpot ? 150 : 30;
            let p = Array.from({length: count}, () => ({ 
                x: canvas.width/2, y: canvas.height/2, 
                dx: (Math.random()-0.5) * (isJackpot ? 25 : 12), 
                dy: (Math.random()-0.5) * (isJackpot ? 25 : 12), 
                c: isJackpot ? `hsl(${Math.random()*40+40},100%,50%)` : `hsl(${Math.random()*360},100%,50%)` 
            }));
            function anim() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                p.forEach((i,idx) => { 
                    i.x += i.dx; i.y += i.dy; i.dy += 0.25; 
                    ctx.fillStyle = i.c; ctx.beginPath(); ctx.arc(i.x, i.y, isJackpot ? 8 : 4, 0, 7); ctx.fill(); 
                    if(i.y > canvas.height) p.splice(idx,1); 
                });
                if(p.length) requestAnimationFrame(anim);
            }
            anim();
        }

        function backToSlots() { document.getElementById('prizeScreen').classList.remove('active'); document.getElementById('slotScreen').classList.add('active'); resetGame(); }

        document.getElementById('fsBtn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
    </script>
</body>
</html>
